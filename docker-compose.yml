services:
  preptrac:
    build: .
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=production
      - PORT=8008
      - DATABASE_URL=file:/app/data/dev.db
      # Shared secret that gates the /api/cron/notifications runner.
      # Generate one with: openssl rand -hex 32
      # Set this (and the SMTP_* vars) in your Coolify env, then schedule a task
      # to call: wget -qO- "http://localhost:8008/api/cron/notifications" \
      #   --header="Authorization: Bearer $CRON_SECRET"
      - CRON_SECRET=
      # Optional SMTP for email notifications (overridable per-user in Settings)
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM=
    volumes:
      - preptrac-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8008/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  preptrac-data:
